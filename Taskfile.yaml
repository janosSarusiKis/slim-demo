version: "3"

dotenv: [".env"]

tasks:
  secret:
    desc: Generate a random shared secret into .env
    status: [test -f .env]
    cmds:
      - cp .env.example .env
      - sed -i '' "s|^SLIM_SHARED_SECRET=.*|SLIM_SHARED_SECRET=$(openssl rand -hex 32)|" .env

  node:
    desc: Start the SLIM node in Docker
    cmds: [docker compose up -d slim]

  agent:
    desc: Run the home agent on this machine (Act 2)
    cmds:
      - uv run python -m slim_demo.agent {{.CLI_ARGS}}

  ticker:
    desc: Run the cloud assistant that calls the agent every second
    cmds:
      - uv run python -m slim_demo.ticker {{.CLI_ARGS}}

  agent:cloud:
    desc: Start the agent's container copy (Act 3)
    cmds: [docker compose up -d --build agent]

  agent:cloud:stop:
    desc: Stop the container copy
    cmds: [docker compose stop agent]

  agent:go:
    desc: Start the Go rewrite of the agent in a container (encore)
    cmds: [docker compose up -d --build agent-go]

  agent:go:stop:
    desc: Stop the Go container
    cmds: [docker compose stop agent-go]

  farm:build:
    desc: Build the farm images (do this before the demo)
    cmds: [docker compose --profile agent --profile farm --profile backup build]

  farm:up:
    desc: Start the SLIM node, GH2, pest scout, sprayer and agronomist in Docker
    cmds: [docker compose --profile farm up -d slim gh2 scout sprayer agronomist]

  gh1:
    desc: Run Greenhouse 1's main box on this machine
    env: {AGENT_LOCATION: GH1 main box}
    cmds:
      - uv run python -m farm.greenhouse --id gh1

  guardian:
    desc: Run the guardian (needs Docker on this machine to start GH1's backup box)
    env: {AGENT_LOCATION: farm office}
    cmds:
      - uv run python -m farm.guardian

  dashboard:
    desc: Run the farm assistant dashboard on http://localhost:8080
    env: {AGENT_LOCATION: farmer's laptop}
    cmds:
      - uv run python -m farm.assistant

  farm:down:
    desc: Stop all farm containers
    cmds: [docker compose --profile farm --profile backup down]

  ports:
    desc: Show which processes on this machine listen on TCP ports
    cmds: [lsof -nP -iTCP -sTCP:LISTEN]

  down:
    desc: Stop everything in Docker
    cmds: [docker compose --profile agent --profile ticker down]
